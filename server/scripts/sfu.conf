# SFU Server 配置
# TCP_PORT: 客户端信令/数据连接端口（SFU 主端口）
TCP_PORT=9200
# UDP_PORT: 音视频流传输端口（0 = 禁用 UDP）
UDP_PORT=9201
# STUN_PORT: STUN 服务端口（0 = 自动 UDP_PORT+1）
STUN_PORT=9202
# MAX_CLIENTS: 最大并发客户端数
MAX_CLIENTS=1024
# SESSION_TIMEOUT: UDP 会话超时秒数
SESSION_TIMEOUT=3
# STATS_INTERVAL: 统计打印间隔（秒），0 = 关闭
STATS_INTERVAL=10
# VERBOSE: verbose 日志
VERBOSE=0